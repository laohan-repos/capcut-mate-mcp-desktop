name: Upload desktop release assets

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop release builds run ID
        required: true
        type: string
      release_tag:
        description: Draft release tag targeting the build's commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify build and draft release
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          build_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq \
            'select(.conclusion == "success" and .path == ".github/workflows/desktop-release.yml") | .head_sha')"
          draft_commit="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')"

          if [[ -z "$build_commit" || "$draft_commit" != "$build_commit" ]]; then
            echo "::error::The draft release must target the commit from the successful desktop build."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run }}
          pattern: capcut-mate-*
          merge-multiple: true
          path: release-assets
      - name: Verify checksums and upload missing assets
        working-directory: release-assets
        run: |
          installers=(
            capcut-mate-macos-arm64-installer.dmg
            capcut-mate-macos-x64-installer.dmg
            capcut-mate-windows-arm64-installer.exe
            capcut-mate-windows-x64-installer.exe
          )
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          uploaded_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"

          if grep -Fxq SHA256SUMS.txt <<< "$uploaded_assets"; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS.txt --output published-checksums.txt
            cmp SHA256SUMS.txt published-checksums.txt
          fi

          missing_assets=()
          for asset in "${installers[@]}" SHA256SUMS.txt; do
            if ! grep -Fxq "$asset" <<< "$uploaded_assets"; then
              missing_assets+=("$asset")
            fi
          done

          if (( ${#missing_assets[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing_assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi
